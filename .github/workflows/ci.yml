name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build must not require a live database — settings/pages fall back to
      # code defaults when the DB is unreachable. A placeholder keeps Prisma happy.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/placeholder?schema=public"
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
      APP_ENCRYPTION_KEY: "Y2ktcGxhY2Vob2xkZXIta2V5LTMyLWJ5dGVzISE="
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
