# /etc/nginx/conf.d/a7-website.conf  (REFERENCE)
#
# Edit ONLY this file. Do not touch any other app's nginx config. Always run
# `nginx -t` before `systemctl reload nginx`. The SSL lines are managed by
# certbot — keep whatever certbot already wrote; the blocks below show what to
# add/change for the admin panel and uploads.

# Rate-limit zones (safe to add once; if a zone with this name already exists
# elsewhere, rename these).
limit_req_zone $binary_remote_addr zone=a7_admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=a7_api:10m rate=30r/s;

server {
    server_name a7grouprealestate.com www.a7grouprealestate.com site.srv1802669.hstgr.cloud;

    client_max_body_size 50m;

    # Serve uploaded media directly from disk with a long cache.
    location /uploads/ {
        alias /opt/a7-website-data/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Keep the old mock routes returning 404 (unchanged behaviour).
    location ~ ^/(dashboard|login|register|components|icons|deep-research) {
        return 404;
    }

    # Throttle admin login submissions.
    location = /admin/login {
        limit_req zone=a7_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Light throttle on API routes.
    location /api/ {
        limit_req zone=a7_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (public site + /admin/**) proxies to the Next.js app.
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- certbot-managed TLS (keep your existing lines) ---
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/a7grouprealestate.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/a7grouprealestate.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

